
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天室</title>

<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: Arial;
  background: #ece5dd;
}

/* 整體 */
body {
  display: flex;
  flex-direction: column;
}

/* 聊天區 */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
}

/* 訊息泡泡 */
.msg {
  max-width: 70%;
  padding: 8px 12px;
  margin: 6px;
  border-radius: 16px;
  font-size: 14px;
}

/* 自己 */
.me {
  align-self: flex-end;
  background: #dcf8c6;
}

/* 對方 */
.other {
  align-self: flex-start;
  background: #fff;
}

/* 圖片 */
img {
  max-width: 200px;
  border-radius: 10px;
  margin-top: 5px;
}

/* 底部輸入區 */
#inputArea {
  display: flex;
  padding: 10px;
  background: #fff;
  border-top: 1px solid #ccc;
}

/* 輸入框 */
#text {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: 1px solid #ccc;
}

/* 按鈕 */
button {
  margin-left: 5px;
  padding: 10px;
  border: none;
  border-radius: 50%;
  background: #128C7E;
  color: white;
  font-size: 16px;
}
</style>
</head>

<body>

<div id="chat"></div>

<div id="inputArea">
  <input id="text" placeholder="輸入訊息...">
  <button onclick="sendText()">➤</button>
  <input type="file" id="file" style="display:none" onchange="sendImage(event)">
  <button onclick="document.getElementById('file').click()">📷</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDBQk7gNIxI0nKuEnm5FttAxHGtylD_HE0",
  authDomain: "chatroom-4c85f.firebaseapp.com",
  databaseURL: "https://chatroom-4c85f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "chatroom-4c85f",
  storageBucket: "chatroom-4c85f.firebasestorage.app",
  messagingSenderId: "912615705409",
  appId: "1:912615705409:web:0677ad4bc51d25327b6fc0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* 每個裝置一個ID（用來左右氣泡） */
let myId = localStorage.getItem("myId");
if (!myId) {
  myId = Date.now();
  localStorage.setItem("myId", myId);
}

const chat = document.getElementById("chat");

/* 即時更新 */
onValue(ref(db, "messages"), snapshot => {
  chat.innerHTML = "";
  const data = snapshot.val();
  if (!data) return;

  Object.values(data).forEach(msg => {
    const div = document.createElement("div");
    div.className = "msg " + (msg.user == myId ? "me" : "other");

    if (msg.type === "text") {
      div.textContent = msg.content;
    } else {
      const img = document.createElement("img");
      img.src = msg.content;
      div.appendChild(img);
    }

    chat.appendChild(div);
  });

  chat.scrollTop = chat.scrollHeight;
});

/* 傳文字 */
window.sendText = function () {
  const text = document.getElementById("text").value;
  if (!text) return;

  push(ref(db, "messages"), {
    type: "text",
    content: text,
    user: myId
  });

  document.getElementById("text").value = "";
};

/* 傳圖片 */
window.sendImage = function (e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    push(ref(db, "messages"), {
      type: "image",
      content: reader.result,
      user: myId
    });
  };

  reader.readAsDataURL(file);
};
</script>

</body>
</html>
