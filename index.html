
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>聊天室</title>
  <style>
    body { font-family: Arial; padding: 20px; background:#f5f5f5;}
    #chat { height: 400px; overflow-y: auto; border: 1px solid #ccc; background:white; padding: 10px; }
    .msg { margin-bottom:10px; }
    img { max-width: 200px; display: block; margin-top: 5px; border-radius:10px;}
    button { padding:5px 10px; }
  </style>
</head>
<body>

<h2>📱 簡易聊天室</h2>

<div id="chat"></div>

<br>

<input id="text" placeholder="輸入訊息">
<button onclick="sendText()">送出</button>
<input type="file" onchange="sendImage(event)">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDBQk7gNIxI0nKuEnm5FttAxHGtylD_HE0",
  authDomain: "chatroom-4c85f.firebaseapp.com",
  databaseURL: "https://chatroom-4c85f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "chatroom-4c85f",
  storageBucket: "chatroom-4c85f.firebasestorage.app",
  messagingSenderId: "912615705409",
  appId: "1:912615705409:web:0677ad4bc51d25327b6fc0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const chat = document.getElementById("chat");

onValue(ref(db, "messages"), snapshot => {
  chat.innerHTML = "";
  const data = snapshot.val();
  if (!data) return;

  Object.values(data).forEach(msg => {
    const div = document.createElement("div");
    div.className = "msg";

    if (msg.type === "text") {
      div.textContent = msg.content;
    } else {
      const img = document.createElement("img");
      img.src = msg.content;
      div.appendChild(img);
    }

    chat.appendChild(div);
  });
});

window.sendText = function () {
  const text = document.getElementById("text").value;
  if (!text) return;

  push(ref(db, "messages"), { type: "text", content: text });
  document.getElementById("text").value = "";
};

window.sendImage = function (e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    push(ref(db, "messages"), { type: "image", content: reader.result });
  };
  reader.readAsDataURL(file);
};
</script>

</body>
</html>
